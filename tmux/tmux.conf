unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
# split terminal
bind J split-window -v -l '20%' 

bind l select-pane -R
setw -g mode-keys vi
set -g mouse on

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'


bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"





# theming
# Basic colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar colors
set -g status on
set -g status-interval 5
set -g status-justify centre

set -g status-bg '#0a0a0a'  # almost black
set -g status-fg '#c0c0c0'  # metallic gray

# Show full session name on the left of status bar
set -g status-left-length 100
set -g status-left "#[fg=#c0c0c0,bg=#0a0a0a] 会议[ #S ]"
set -g status-right-length 100
set -g status-right "#[fg=#c0c0c0,bg=#0a0a0a] 时间[#(date)]"


# Active window title
set-window-option -g window-status-current-format "#[bg=#4a4a4a,fg=#ffffff] #I:#W "

# Inactive window titles
set-window-option -g window-status-format "#[bg=#1a1a1a,fg=#888888] #I:#W "

# Window with activity
set-window-option -g window-status-activity-style "bg=#333333,fg=#ffffff"

# Pane border colors
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#6a6a6a"

# Message colors (for prompts)
set -g message-style "bg=#1a1a1a,fg=#c0c0c0"

# Command message (when you press prefix + :)
set -g message-command-style "bg=#1a1a1a,fg=#ffffff"

# Mode style (copy mode, etc.)
set -g mode-style "bg=#4a4a4a,fg=#ffffff"

# Clock mode colors
set -g clock-mode-colour '#c0c0c0'
set -g clock-mode-style 24

# Bell
set -g visual-bell on
set -g bell-action none
